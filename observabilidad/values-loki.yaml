# values-loki.yaml
# Instalación de Loki en modo SingleBinary para el TP4

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

singleBinary:
  replicas: 1
  persistence:
    size: 5Gi

# Deshabilitar componentes de SimpleScalable/Distributed
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Deshabilitar gateway (no necesario en modo SingleBinary local)
gateway:
  enabled: false

# Deshabilitar chunksCache, resultsCache
chunksCache:
  enabled: false
resultsCache:
  enabled: false
